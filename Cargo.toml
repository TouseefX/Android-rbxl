[package]
name = "rbxl-editor"
version = "3.1.0"
edition = "2024"

[lib]
# cdylib is what xbuild packages into the APK (librbxl_editor.so, loaded by
# MainActivity/GameActivity); rlib lets the desktop bin link the same code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rbxl-editor-desktop"
path = "src/main_desktop.rs"

[dependencies]
rbx_dom_weak = "4"
rbx_binary   = "3"
rbx_reflection = "7"
rbx_reflection_database = "3"
rbxcloud     = "0.17"
pollster     = "0.4"
ndk-context  = "0.1"
jni          = "0.21"
anyhow       = "1"
log          = "0.4"
android_logger = "0.14"
rbx_xml = "2"
flate2 = "1.1.9"
zstd = "0.13"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Embedded Luau VM for the script runner / plugin host. Uses TouseefX/luaur — a
# pure-Rust, full-accuracy Luau port with Android support. `default-features =
# false` skips the CLI binary and static type checker; we only need the runtime.
luaur = { git = "https://github.com/TouseefX/luaur", branch = "main", default-features = false, features = [] }

# Bevy owns the whole window (so it gets a GPU context and can render the 3D
# viewport natively on Android). egui runs INSIDE Bevy via bevy_egui.
# android-game-activity provides a proper InputConnection / soft-keyboard
# (GameActivity's GameTextInput), which makes Gboard/Samsung paste work.
bevy = { version = "0.17", default-features = false, features = [
    "android-game-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
] }
# egui inside Bevy (re-exports its own egui 0.33). 0.38 targets Bevy 0.17.
# Use `bevy_egui::egui::...` directly — no separate `egui` dependency, so the
# editor always uses exactly the egui version bevy_egui was built against.
# CRITICAL: `render` must be enabled — that's the feature that actually draws
# egui to the screen. `bevy_ui` is also part of the default and needed for the
# egui UI to composite. Without them egui runs but shows nothing (only Bevy's
# clear color). We skip manage_clipboard/open_url/picking to avoid pulling
# webbrowser/bevy_picking onto Android.
bevy_egui = { version = "0.38", default-features = false, features = ["render", "bevy_ui", "default_fonts"] }

# ----------------------------------------------------------------------------
# Android-only dependencies.
#
# `android-activity` is what actually implements the GameActivity glue that
# Bevy's `android-game-activity` feature selects. We depend on it directly so
# that the version is pinned and stays in lock-step with the AAR declared in
# `manifest.yaml`: android-activity 0.6.x targets
# `androidx.games:games-activity:4.4.0` (backwards compatible with 4.0.0).
# If you bump one, bump the other.
# ----------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }

# ----------------------------------------------------------------------------
# Release profile — keeps the APK small WITHOUT losing the ability to debug.
#
# `strip = "debuginfo"` removes the bulky DWARF debug sections but KEEPS the
# symbol table, so crash backtraces in logcat still resolve to function names
# (and you can `addr2line`/`ndk-stack` them). That's the big size saver.
# opt-level/lto/codegen-units also shrink the code itself.
#
# If you want the very smallest APK at the cost of losing symbol names for
# offline analysis, switch strip to "symbols" (or true).
# ----------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
debug = false
panic = "abort"

# Keep dependency crate sizes down too.
[profile.release.package."*"]
opt-level = 3

[features]
default = []
# Enable audio playback on desktop via rodio. Android uses MediaPlayer
# via JNI regardless of this feature.
desktop_audio = ["rodio"]

[dependencies.rodio]
version = "0.20"
optional = true
