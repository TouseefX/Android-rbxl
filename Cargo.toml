[package]
name = "rbxl-editor"
version = "3.1.0"
edition = "2024"

[lib]
# cdylib is what cargo-apk2 packages on Android; rlib lets a desktop bin link it.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rbxl-editor-desktop"
path = "src/main_desktop.rs"

[dependencies]
rbx_dom_weak = "4"
rbx_binary   = "3"
rbx_reflection = "7"
rbx_reflection_database = "3"
rbxcloud     = "0.17"
pollster     = "0.4"
ndk-context  = "0.1"
jni          = "0.21"
anyhow       = "1"
log          = "0.4"
android_logger = "0.14"
rbx_xml = "2"
flate2 = "1.1.9"
zstd = "0.13"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Bevy owns the whole window (so it gets a GPU context and can render the 3D
# viewport natively on Android). egui runs INSIDE Bevy via bevy_egui.
# android-native-activity (not the default game-activity) is what cargo-apk2 +
# the existing NativeActivity MainActivity.java use.
bevy = { version = "0.17", default-features = false, features = [
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
] }
# egui inside Bevy (re-exports its own egui 0.33). 0.38 targets Bevy 0.17.
# Use `bevy_egui::egui::...` directly — no separate `egui` dependency, so the
# editor always uses exactly the egui version bevy_egui was built against.
# CRITICAL: `render` must be enabled — that's the feature that actually draws
# egui to the screen. `bevy_ui` is also part of the default and needed for the
# egui UI to composite. Without them egui runs but shows nothing (only Bevy's
# clear color). We skip manage_clipboard/open_url/picking to avoid pulling
# webbrowser/bevy_picking onto Android.
bevy_egui = { version = "0.38", default-features = false, features = ["render", "bevy_ui", "default_fonts"] }

# ----------------------------------------------------------------------------
# Release profile — keeps the APK small WITHOUT losing the ability to debug.
#
# `strip = "debuginfo"` removes the bulky DWARF debug sections but KEEPS the
# symbol table, so crash backtraces in logcat still resolve to function names
# (and you can `addr2line`/`ndk-stack` them). That's the big size saver.
# opt-level/lto/codegen-units also shrink the code itself.
#
# If you want the very smallest APK at the cost of losing symbol names for
# offline analysis, switch strip to "symbols" (or true).
# ----------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
debug = false
panic = "abort"

# Keep dependency crate sizes down too.
[profile.release.package."*"]
opt-level = 3

[package.metadata.android]
package = "com.yourname.rbxleditor"
apk_label = "rbxl Editor v3.1"
apk_name = "rbxleditor"
build_targets = ["aarch64-linux-android"]
java_sources = "java"
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
extract_native_libs = true
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = ".MainActivity"
launch_mode = "singleTop"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
orientation = "sensor"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rbxl_editor"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
# cargo-apk2 joins this against the crate root. In CI the workflow overrides it
# via CARGO_APK_RELEASE_KEYSTORE (see .github/workflows/main.yml), so this is
# only a local fallback. Generate it with:
#   keytool -genkey -v -keystore keystore.jks -storepass android -keypass android \
#     -alias rbxl -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=rbxl"
path = "keystore.jks"
keystore_password = "android"
key_alias = "rbxl"
key_password = "android"
