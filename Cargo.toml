[package]
name = "rbxl-editor"
version = "3.1.0"
edition = "2024"

[lib]
# cdylib is what xbuild packages into the APK (librbxl_editor.so, loaded by
# MainActivity/GameActivity); rlib lets the desktop bin link the same code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rbxl-editor-desktop"
path = "src/main_desktop.rs"

[dependencies]
rbx_dom_weak = "4"
rbx_binary   = "3"
rbx_reflection = "7"
rbx_reflection_database = "3"
rbxcloud     = "0.17"
pollster     = "0.4"
ndk-context  = "0.1"
jni          = "0.21"
anyhow       = "1"
log          = "0.4"
android_logger = "0.14"
rbx_xml = "2"
# Complete Roblox mesh v2-v5 decoder. Only the mesh feature is enabled, so no
# union/zstd native dependencies are added to the Android build.
rbx_mesh = { version = "0.7", default-features = false, features = ["mesh"] }
flate2 = "1.1.9"
zstd = "0.13"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
# 2022 RakPeerCrypto-compatible primitives for encrypted OpenRequest2. These
# are pure Rust, so the Android build does not need to package libsodium.
blake2 = "0.10"
sha2 = "0.10"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
getrandom = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# RbxTransport Team Create uses QUIC/TLS 1.3. The default Rustls backend
# verifies the expected RFC 7250 raw public key; the optional OpenSSL backend is
# used for the 0xFF00 ClientHello extension and currently disables peer verification.
# ngnet-quic provides the lower-level ngtcp2 transport, custom CIDs and DATAGRAM hooks.
ngnet-quic = { path = "vendor/ngnet-quic", default-features = false }
# socket2 for creating and configuring the QUIC UDP socket, including its
# best-effort traffic-class setting. Same major version tokio already depends on.
socket2 = "0.5"
# libc for raw PMTU-discovery and per-socket MTU options not exposed by socket2;
# the code treats these fragmentation requests as best-effort.
libc = "0.2"
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip", "brotli", "zstd"] }
# Roblox CDN textures are not guaranteed to be PNG/JPEG; modern assets often
# arrive as WebP and older uploaded images can be GIF/BMP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Embedded Luau runtime for the script runner / plugin host. TouseefX/luaur is
# a pure-Rust implementation that can be built for Android. `default-features =
# false` skips its CLI and static type-checker features; this app uses the runtime.
luaur = { git = "https://github.com/TouseefX/luaur", branch = "main", default-features = false, features = [] }

# Bevy owns the whole window and renders the 3D viewport natively on Android;
# egui runs inside Bevy via bevy_egui. The android-game-activity feature selects
# GameActivity glue, whose GameTextInput supplies Android's InputConnection.
# src/android_ime.rs bridges that input into egui; clipboard access is separate.
bevy = { version = "0.17", default-features = false, features = [
    "android-game-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
] }
# egui inside Bevy (re-exports its own egui 0.33). 0.38 targets Bevy 0.17.
# Use `bevy_egui::egui::...` directly — no separate `egui` dependency, so the
# editor always uses exactly the egui version bevy_egui was built against.
# CRITICAL: `render` must be enabled — that's the feature that actually draws
# egui to the screen. `bevy_ui` is also part of the default and needed for the
# egui UI to composite. Without them egui runs but shows nothing (only Bevy's
# clear color). We skip manage_clipboard/open_url/picking to avoid pulling
# webbrowser/bevy_picking onto Android.
bevy_egui = { version = "0.38", default-features = false, features = ["render", "bevy_ui", "default_fonts"] }

# ----------------------------------------------------------------------------
# Android-only dependencies.
#
# `android-activity` implements the GameActivity glue selected by Bevy's
# `android-game-activity` feature. Pin it directly alongside the
# `androidx.games:games-activity` AAR declared in `manifest.yaml`; review both
# versions together when upgrading.
# ----------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }

# ----------------------------------------------------------------------------
# Release profile — keeps the APK small WITHOUT losing the ability to debug.
#
# `strip = "debuginfo"` removes the bulky DWARF debug sections but KEEPS the
# symbol table, so crash backtraces in logcat still resolve to function names
# (and you can `addr2line`/`ndk-stack` them). That's the big size saver.
# opt-level/lto/codegen-units also shrink the code itself.
#
# If you want the very smallest APK at the cost of losing symbol names for
# offline analysis, switch strip to "symbols" (or true).
# ----------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
debug = false
# Release builds are shipped, never resumed incrementally; disabling
# incremental compilation avoids stale-incremental bloat/corruption.
incremental = false
# Command-bar Luau runs are isolated with catch_unwind so a malformed script or
# VM edge case reports an editor error instead of terminating the Android app.
panic = "unwind"

# Keep dependency crate sizes down too.
[profile.release.package."*"]
opt-level = 3

[features]
default = []
# Enable audio playback on desktop via rodio. Android uses MediaPlayer
# via JNI regardless of this feature.
desktop_audio = ["rodio"]
# Drive TLS through OpenSSL instead of Rustls so the ClientHello can register
# 0xFF00 as a custom extension. The default Rustls path does not add this extension;
# its legacy packet-splice helper is retained for layout tests only.
# WARNING: the current OpenSSL builder requests the raw-public-key certificate
# type but uses DangerouslyAcceptAnyCertificate, so it does not verify the peer.
#
# Off by default because ngnet-quic-sys requires OpenSSL >= 3.5.0 - the first
# release carrying the QUIC TLS API ngtcp2's ossl helper is written against - and
# neither the host runner nor the Android NDK ships one. Enabling it means pointing
# OPENSSL_DIR at a build of 3.5.x, which the `check-openssl-android` job does.
ossl-tls = ["ngnet-quic/tls-ossl"]

[dependencies.rodio]
version = "0.20"
optional = true
