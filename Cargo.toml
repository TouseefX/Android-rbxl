[package]
name = "rbxl-editor"
version = "3.1.0"
edition = "2024"

[lib]
# cdylib is what cargo-apk2 packages on Android; rlib lets a desktop bin link it.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rbxl-editor-desktop"
path = "src/main_desktop.rs"

[dependencies]
rbx_dom_weak = "3"
rbx_binary   = "1"
rbx_reflection = "5"
rbx_reflection_database = "1.0"
rbxcloud     = "0.17"
pollster     = "0.4"
ndk-context  = "0.1"
jni          = "0.21"
anyhow       = "1"
log          = "0.4"
android_logger = "0.14"
rbx_xml = "1.0.0"
flate2 = "1.1.9"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Bevy owns the whole window (so it gets a GPU context and can render the 3D
# viewport natively on Android). egui runs INSIDE Bevy via bevy_egui.
# android-native-activity (not the default game-activity) is what cargo-apk2 +
# the existing NativeActivity MainActivity.java use.
bevy = { version = "0.17", default-features = false, features = [
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
] }
# egui inside Bevy (re-exports its own egui 0.33). 0.38 targets Bevy 0.17.
bevy_egui = { version = "0.38", default-features = false, features = ["default_fonts"] }
# Pin egui to the SAME version bevy_egui 0.38 uses (0.33) so the editor's
# existing `use egui::...` code resolves to the identical types bevy_egui uses.
egui = "0.33"

[package.metadata.android]
package = "com.yourname.rbxleditor"
apk_label = "rbxl Editor v3.1"
apk_name = "rbxleditor"
build_targets = ["aarch64-linux-android"]
java_sources = "java"
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
extract_native_libs = true
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = ".MainActivity"
launch_mode = "singleTop"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
orientation = "sensor"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rbxl_editor"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "/home/user/.android/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
