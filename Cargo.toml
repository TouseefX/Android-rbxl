[package]
name = "rbxl-editor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
rbx_dom_weak = "3"
rbx_binary   = "1"
rbx_reflection = "5"
rbx_reflection_database = "1.0"
rbxcloud     = "0.17"
pollster     = "0.4"
eframe       = { version = "0.34", default-features = false, features = ["glow", "android-native-activity"] }
egui         = "0.34"
egui_code_editor = "0.2"
winit        = { version = "0.30", features = ["android-native-activity"] }
ndk-context  = "0.1"
jni          = "0.21"
anyhow       = "1"
log          = "0.4"
android_logger = "0.14"

[package.metadata.android]
package = "com.yourname.rbxleditor"
apk_label = "rbxl Editor"
apk_name = "rbxleditor"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
java_sources = "java"
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
extract_native_libs = true
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = ".MainActivity"
launch_mode = "singleTop"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
orientation = "sensor"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rbxl_editor"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "/home/user/.android/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
