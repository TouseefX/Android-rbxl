[workspace]
resolver = "2"
members = ["crates/egui"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.33.0"

[workspace.dependencies]
emath = { version = "0.33.0", default-features = false }
epaint = { version = "0.33.0", default-features = false }
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
bitflags = "2.9.4"
log = { version = "0.4.28", features = ["std"] }
nohash-hasher = "0.2.0"
profiling = { version = "1.0.17", default-features = false }
smallvec = "1.15.1"
unicode-segmentation = "1.12.0"
accesskit = "0.21.1"
backtrace = "0.3.76"
document-features = "0.2.11"
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
rayon = "1.11.0"
cint = "0.3.1"
mint = "0.5.9"
