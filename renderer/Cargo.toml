# ============================================================================
# bevy_rbxl — standalone Bevy renderer for .rbxl / .rbxmx / .rbxm places
# ----------------------------------------------------------------------------
# A standalone Bevy renderer sandbox for Roblox place/model files. It has its
# own dependency versions and rendering code; it is not the root app's desktop
# runner or an Android build target. Use the root desktop binary to exercise
# the main application's renderer.
#
# Build & run (from the repo root):
#   cargo run --release --manifest-path renderer/Cargo.toml -- place.rbxl
# or copy an .rbxl into renderer/ and:   cargo run --release -p bevy_rbxl
#
# Controls: left-drag = orbit, scroll = zoom, WASD/arrows = pan, Q/E = up/down.
# ============================================================================
[package]
name = "bevy_rbxl"
version = "0.1.0"
edition = "2021"

# Keep this crate out of the (Android) workspace and standalone.
[workspace]

[dependencies]
bevy = "0.17"
rbx_dom_weak = "3"
rbx_binary = "1"
rbx_xml = "1.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
anyhow = "1"

[profile.release]
opt-level = 3
