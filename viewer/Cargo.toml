# ============================================================================
# rbxl-viewer — standalone Bevy GPU viewer for Roblox places
# ----------------------------------------------------------------------------
# This is the "Option A" app: Bevy runs as its OWN native Android activity
# (NativeActivity), which is the supported way Bevy renders on Android — unlike
# trying to embed Bevy inside the egui editor (which fails because Bevy can't
# get a GPU context inside eframe's window).
#
# Build for Android (cargo-apk2 / GitHub Actions):
#   cd viewer && cargo apk2 build --lib
# Validate on desktop:
#   cd viewer && cargo run -- /path/to/place.rbxl
# ============================================================================
[package]
name = "rbxl-viewer"
version = "0.1.0"
edition = "2021"

[lib]
name = "rbxl_viewer"
# rlib lets the desktop bin link it; cdylib is what cargo-apk2 packages on Android.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rbxl-viewer"
path = "src/main.rs"

[dependencies]
# Full-screen native app: we DO need bevy_winit (Bevy owns its own window here),
# and android-native-activity (NOT the default game-activity, which is
# incompatible with cargo-apk2).
bevy = { version = "0.17", default-features = false, features = [
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
] }
rbx_dom_weak = "3"
rbx_binary   = "1"
rbx_xml      = "1.0.0"
flate2       = "1"
anyhow       = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log          = "0.4"
android_logger = "0.14"

[package.metadata.android]
package = "com.yourname.rbxlviewer"
apk_label = "rbxl Viewer"
apk_name = "rbxlviewer"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

# Shared external storage so the editor can drop current.rbxl here and this
# viewer can read it by absolute path.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
extract_native_libs = true
uses_cleartext_traffic = true

# NativeActivity: this is what makes Bevy (with android-native-activity) work
# under cargo-apk2. No Java source needed.
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
launch_mode = "singleTop"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
orientation = "sensor"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rbxl_viewer"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "/home/user/.android/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
