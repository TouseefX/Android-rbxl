name: Build and test

on:
  workflow_dispatch:
  # Every push to a working branch or master runs the host check-and-test job.
  # The APK build stays manual-only (see the `if` on build-android below) so a
  # push does not burn 10+ minutes cross-compiling and uploading artifacts.
  push:
    branches:
      - master
      - 'arena/**'

# ---------------------------------------------------------------------------
# Build pipeline: xbuild (https://github.com/rust-mobile/xbuild)
#
# xbuild is given `gradle: true` in manifest.yaml, so it:
#   1. cross-compiles the Rust cdylib (librbxl_editor.so) against the NDK,
#   2. generates a real Gradle/AGP project under target/x/release/android/gradle,
#   3. copies kotlin/*.kt into it and resolves the Maven deps declared in
#      manifest.yaml (games-activity, appcompat, core) from Google's Maven,
#   4. runs `gradle assemble` to produce the APK.
#
# That last part is why we moved off cargo-apk2: cargo-apk2 calls `javac` with
# nothing but android.jar on the classpath, so an Activity extending
# GameActivity cannot compile (37 "cannot find symbol" errors).
#
# Two knobs are needed to make xbuild's generated project modern enough:
#   * ~/.cache/x/Android.ndk is symlinked to a real NDK sysroot instead of the
#     ancient one xbuild downloads (that one has no API-34 stubs).
#   * ~/.gradle/init.d/ pins AGP/Kotlin plugin versions, because xbuild's
#     template hardcodes AGP 7.3.0 / Kotlin 1.7.20 which cannot build against
#     compileSdk 34 or consume modern AndroidX AARs.
# ---------------------------------------------------------------------------

env:
  # Must expose usr/lib/aarch64-linux-android/<target_sdk_version> (34).
  NDK_VERSION: r27c
  GRADLE_VERSION: "8.11.1"
  AGP_VERSION: "8.7.3"
  KOTLIN_PLUGIN_VERSION: "2.1.21"
  # Pinned xbuild revision (master @ 2025-08-15) so builds are reproducible.
  XBUILD_REV: e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1
  CARGO_BUILD_JOBS: 2                 # Matches the 2-core runner hardware
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16 # Splits compilation into parallel chunks
  CARGO_PROFILE_RELEASE_DEBUG: 0      # Disables RAM-heavy debug symbols
  CARGO_PROFILE_RELEASE_LTO: "thin"   # "thin" LTO is significantly faster and uses less RAM than "fat" LTO

jobs:
  build-android:
    name: Build Android APK
    # Manual-only: the full NDK/Gradle/APK pipeline is expensive, so it is not
    # run on every push. Dispatch it from the Actions tab (or `gh workflow run`)
    # when an APK is actually wanted.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      # xbuild always compiles against $XDG_CACHE_HOME/x/Android.ndk. By default
      # it downloads a 2022-era sysroot from its own GitHub release, which has
      # no API-34 stubs (`x` then fails with "ndk doesn't support sdk version
      # 34"). Point it at the real NDK sysroot instead and put the NDK's
      # clang/llvm-ar/lld first on PATH, since that is what xbuild invokes.
      - name: Wire xbuild up to the real NDK
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$SYSROOT/usr/lib/aarch64-linux-android/34"
          mkdir -p "$HOME/.cache/x"
          rm -rf "$HOME/.cache/x/Android.ndk"
          ln -s "$SYSROOT" "$HOME/.cache/x/Android.ndk"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          ls "$SYSROOT/usr/lib/aarch64-linux-android" | tr '\n' ' '

      # xbuild's generated Gradle project hardcodes AGP 7.3.0 / Kotlin 1.7.20.
      # An init script rewrites those plugin requests to current versions so the
      # build can use compileSdk 34 and modern AndroidX artifacts.
      - name: Configure Gradle (AGP/Kotlin overrides)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/xbuild-overrides.gradle" <<EOF
          settingsEvaluated { settings ->
              settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
                  def id = details.requested.id.id
                  if (id == 'com.android.application' || id == 'com.android.library') {
                      details.useModule("com.android.tools.build:gradle:${{ env.AGP_VERSION }}")
                  } else if (id == 'org.jetbrains.kotlin.android') {
                      details.useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${{ env.KOTLIN_PLUGIN_VERSION }}")
                  }
              }
          }
          EOF
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          android.useAndroidX=true
          # xbuild's template targets AGP 7.3; keep the compileSdk sanity check
          # from turning into a hard error after we upgrade the plugin.
          android.suppressUnsupportedCompileSdk=34
          # No Java sources in this project, so a Java/Kotlin target mismatch is
          # not fatal - don't let the check fail the build.
          kotlin.jvm.target.validation.mode=warning
          EOF
          cat "$HOME/.gradle/init.d/xbuild-overrides.gradle"

      - name: Install Rust nightly and the Android target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: xbuild-apk-${{ hashFiles('Cargo.toml') }}

      - name: Cache xbuild binary
        id: cache-x
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/x
          key: xbuild-${{ env.XBUILD_REV }}-${{ runner.os }}

      - name: Install xbuild
        if: steps.cache-x.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Build the tool itself with stable (its dependency tree predates the
          # current nightly); the app is still cross-compiled with nightly.
          rustup toolchain install stable --profile minimal
          cargo +stable install --locked --git https://github.com/rust-mobile/xbuild \
            --rev "$XBUILD_REV" xbuild

      - name: x doctor
        run: x doctor || true

      - name: Build APK with xbuild
        run: |
          set -euo pipefail
          # --release: the debug profile produced a ~1 GB APK. [profile.release]
          # in Cargo.toml strips DWARF but keeps the symbol table, so logcat
          # backtraces still resolve to function names.
          x build --release --platform android --arch arm64 --format apk --verbose

      - name: Zipalign + sign the APK
        run: |
          set -euo pipefail
          UNSIGNED="target/x/release/android/rbxl-editor.apk"
          test -f "$UNSIGNED" || { echo "xbuild produced no APK"; find target/x -maxdepth 3 -name '*.apk'; exit 1; }

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          KEYSTORE="$RUNNER_TEMP/rbxl-release.jks"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android -keypass android \
              -alias rbxl -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=rbxl, O=rbxl, C=US" >/dev/null 2>&1
          fi

          mkdir -p dist
          # -P 16: 16 KB page alignment, required for Android 15+ devices.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" dist/aligned.apk \
            || "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" dist/aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias rbxl \
            --out dist/rbxleditor.apk dist/aligned.apk
          rm -f dist/aligned.apk dist/aligned.apk.idsig
          "$BUILD_TOOLS/apksigner" verify --verbose dist/rbxleditor.apk
          ls -lh dist/rbxleditor.apk

      # Keep the unstripped native library so crashes can be symbolized offline
      # with ndk-stack / addr2line.
      - name: Collect symbols
        if: always()
        run: |
          set -euo pipefail
          SO="$(find target/x -type f -name 'librbxl_editor.so' | head -n 1 || true)"
          if [ -n "$SO" ]; then
            mkdir -p dist-symbols
            cp "$SO" dist-symbols/librbxl_editor.so
            ls -lh dist-symbols/librbxl_editor.so
          else
            echo "no .so found; skipping symbols artifact"
          fi

      - name: Dump generated Gradle project on failure
        if: failure()
        run: |
          GRADLE_DIR="target/x/release/android/gradle"
          if [ -d "$GRADLE_DIR" ]; then
            echo "--- AndroidManifest.xml"
            cat "$GRADLE_DIR/app/src/main/AndroidManifest.xml" || true
            echo "--- app/build.gradle"
            cat "$GRADLE_DIR/app/build.gradle" || true
            echo "--- sources"
            ls -R "$GRADLE_DIR/app/src/main" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rbxleditor.apk
          path: dist/rbxleditor.apk
          if-no-files-found: error

      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: dist-symbols/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Host-side typecheck + unit tests.
  #
  # `x build` only ever cross-compiles the aarch64 cdylib, so the crate's ~128
  # `#[test]`s never ran and a Rust type error could only be caught by a full
  # 10-minute Android build. This job compiles and tests on the host target in
  # a couple of minutes, and runs in parallel with the APK build rather than
  # gating it.
  # ---------------------------------------------------------------------------
  check-and-test:
    name: Check and test (host)
    runs-on: ubuntu-latest
    env:
      # Cargo colourises even when stdout is not a TTY under Actions, which
      # prefixed every diagnostic with escape codes and defeated the error
      # extraction below.
      CARGO_TERM_COLOR: never
      # Bevy is wide; two parallel rustc invocations keeps the peak memory of a
      # cold target/ build inside the runner's budget.
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # bevy_winit pulls in wayland-sys, whose build script shells out to
      # pkg-config for wayland-client and hard-fails without it. The rest are
      # needed at link time by winit/wgpu on Linux.
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: host-test-${{ hashFiles('Cargo.toml') }}

      # Gate on the plugin session. The full suite is reported separately below
      # because it has pre-existing failures unrelated to this change:
      # challenge::tests::find_challenge_frame_walks_framed_stream aborts the
      # whole process (a Luau null-pointer deref panics non-unwinding from the
      # extern "C" boundary in luaur-vm/src/functions/loadsafe.rs), and three
      # appflow tests fail. Any of those would otherwise mask the signal here.
      - name: cargo test (plugin runtime)
        id: test
        run: |
          set -o pipefail
          cargo test --lib plugin_ 2>&1 | tee /tmp/cargo.log
          cargo test --lib rbx_caps_splice_tests 2>&1 | tee -a /tmp/cargo.log
          # The vendored QUIC crate has its own unit tests; `cargo test --lib`
          # on the workspace root never reaches them.
          cargo test -p ngnet-quic --lib 2>&1 | tee -a /tmp/cargo.log

      - name: Full suite (informational)
        if: always()
        continue-on-error: true
        run: |
          cargo test --lib --no-fail-fast 2>&1 | tee /tmp/cargo-full.log || true

      - name: Report full-suite result
        if: always()
        run: |
          {
            grep -E '^test result:' /tmp/cargo-full.log
            grep -E '^test .* FAILED$' /tmp/cargo-full.log
            grep -E 'non-unwinding panic|SIGABRT|signal: 6' /tmp/cargo-full.log
          } 2>/dev/null | awk '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              out = (out == "" ? $0 : out "%0A" $0)
            }
            END { if (out != "") print "::warning title=full suite::" out }
          '

      - name: Publish test summary
        if: always() && steps.test.outcome == 'success'
        run: |
          grep -E '^(test result:|running [0-9]+ tests?|     Running)' /tmp/cargo.log | awk '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              out = (out == "" ? $0 : out "%0A" $0)
            }
            END { print "::notice title=cargo test::" out }
          '

      # Runner log archives are served from results-receiver.actions.githubusercontent.com,
      # which is not reachable from every environment. Republishing the failure
      # as a check-run annotation keeps the compiler output readable through
      # api.github.com alone.
      - name: Surface failures as annotations
        if: failure() && steps.test.outcome == 'failure'
        run: |
          # Report both the compiler diagnostics and the test harness block.
          # Either alone misses a class of failure: a compile error prints no
          # `running N tests` line, and a test failure or abort buries its
          # output above the warnings that a plain tail picks up.
          diag="$(
            {
              grep -A 10 '^error' /tmp/cargo.log | head -n 45
              awk '/^(running [0-9]+ tests?|failures:)/{flag=1} flag' /tmp/cargo.log | tail -n 25
            } 2>/dev/null
          )"
          if [ -z "$diag" ]; then
            diag="$(tail -n 40 /tmp/cargo.log)"
          fi
          printf '%s\n' "$diag" | awk '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              out = (out == "" ? $0 : out "%0A" $0)
            }
            END { print "::error title=cargo::" out }
          '

  # ---------------------------------------------------------------------------
  # Type-check for the Android target.
  #
  # The host job compiles for x86_64-linux, so nothing behind
  # `#[cfg(target_os = "android")]` is ever compiled there. That is how
  # jni_bridge::is_chromeos shipped a call to a JValueGen method that does not
  # exist - it is only reachable on Android, and the only job that builds for
  # Android costs 10+ minutes of NDK, Gradle and APK packaging.
  #
  # `cargo check` type-checks without linking, so it covers the same cfg gate
  # in a few minutes and needs no Gradle.
  # ---------------------------------------------------------------------------
  check-android:
    name: Check Android target
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      # ngnet-quic-sys cross-compiles ngtcp2 in its build script, so the NDK's
      # clang has to be on PATH and the NDK location exported, exactly as the
      # APK job does.
      - name: Point the NDK env vars at the real sysroot
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust nightly and the Android target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-check-${{ hashFiles('Cargo.toml') }}

      - name: cargo check (aarch64-linux-android)
        id: check
        run: |
          set -o pipefail
          cargo check --lib --target aarch64-linux-android 2>&1 | tee /tmp/android-check.log

      - name: Surface failures as annotations
        if: failure() && steps.check.outcome == 'failure'
        run: |
          diag="$(grep -A 10 '^error' /tmp/android-check.log | head -n 45)"
          if [ -z "$diag" ]; then
            diag="$(tail -n 40 /tmp/android-check.log)"
          fi
          printf '%s\n' "$diag" | awk '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              out = (out == "" ? $0 : out "%0A" $0)
            }
            END { print "::error title=android check::" out }
          '

  # The OpenSSL path is the one that can put 0xFF00 into the ClientHello as a
  # real extension, but ngnet-quic-sys refuses to build against anything older
  # than OpenSSL 3.5.0 and neither the runner nor the NDK ships it. So this job
  # builds one for aarch64-linux-android and type-checks the crate against it.
  check-openssl-android:
    name: Check Android with OpenSSL 3.5
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      OPENSSL_VERSION: "3.5.9"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Point the NDK env vars at the real sysroot
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Restore a previously built OpenSSL
        id: ossl-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ossl-android
          key: openssl-${{ env.OPENSSL_VERSION }}-android-arm64-${{ env.NDK_VERSION }}

      # OpenSSL's android-arm64 target picks its toolchain up from
      # ANDROID_NDK_ROOT, so the NDK step above is all it needs. `no-shared`
      # because ngnet-quic-sys links static archives, and `install_sw` because
      # the documentation is not part of the dependency.
      - name: Cross-compile OpenSSL ${{ env.OPENSSL_VERSION }} for aarch64-linux-android
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        id: ossl-build
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/openssl/openssl/tar.gz/refs/tags/openssl-${OPENSSL_VERSION}" -o /tmp/ossl.tar.gz
          mkdir -p /tmp/ossl-src
          # The archive's top-level directory is named after the repo *and* the
          # ref, so it cannot be predicted from the version alone. Strip it.
          tar -xzf /tmp/ossl.tar.gz -C /tmp/ossl-src --strip-components=1
          cd /tmp/ossl-src
          ./Configure android-arm64 no-shared no-tests no-docs \
            --prefix="${GITHUB_WORKSPACE}/ossl-android" --libdir=lib > /tmp/ossl-configure.log 2>&1 \
            || { tail -n 40 /tmp/ossl-configure.log; exit 1; }
          make -j"$(nproc)" > /tmp/ossl-make.log 2>&1 \
            || { tail -n 60 /tmp/ossl-make.log; exit 1; }
          make install_sw > /tmp/ossl-install.log 2>&1 \
            || { tail -n 40 /tmp/ossl-install.log; exit 1; }

      # Runner log archives are not reachable from every environment, so a
      # failing build has to put its own diagnostics into the run summary.
      - name: Surface OpenSSL build failures as annotations
        if: failure() && steps.ossl-build.outcome == 'failure'
        run: |
          for f in /tmp/ossl-configure.log /tmp/ossl-make.log /tmp/ossl-install.log; do
            [ -s "$f" ] || continue
            tail -n 40 "$f" | awk -v t="$(basename "$f")" '
              {
                gsub(/%/, "%25")
                gsub(/\r/, "%0D")
                out = (out == "" ? $0 : out "%0A" $0)
              }
              END { print "::error title=" t "::" out }
            '
          done

      - name: Report what was built
        run: |
          set -euo pipefail
          export OPENSSL_DIR="${GITHUB_WORKSPACE}/ossl-android"
          echo "OPENSSL_DIR=$OPENSSL_DIR" >> "$GITHUB_ENV"
          ls "$OPENSSL_DIR/include/openssl/ssl.h"
          ls "$OPENSSL_DIR/lib"/libssl.a "$OPENSSL_DIR/lib"/libcrypto.a
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" t "$OPENSSL_DIR/lib/libssl.a" | head -3

      - name: Install Rust nightly and the Android target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-ossl-check-${{ hashFiles('Cargo.toml') }}

      - name: cargo check with the OpenSSL backend
        id: check
        run: |
          set -o pipefail
          cargo check --lib --target aarch64-linux-android --features ossl-tls 2>&1 | tee /tmp/ossl-check.log

      - name: Surface failures as annotations
        if: failure() && steps.check.outcome == 'failure'
        run: |
          diag="$(grep -A 10 '^error' /tmp/ossl-check.log | head -n 45)"
          if [ -z "$diag" ]; then
            diag="$(tail -n 40 /tmp/ossl-check.log)"
          fi
          printf '%s\n' "$diag" | awk '
            {
              gsub(/%/, "%25")
              gsub(/\r/, "%0D")
              out = (out == "" ? $0 : out "%0A" $0)
            }
            END { print "::error title=openssl android check::" out }
          '
